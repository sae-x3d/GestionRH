spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/sirh
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
sirh.storage.root=${SIRH_STORAGE_ROOT:datas}
sirh.cors.allowed-origin-patterns=${SIRH_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.16.*.*:4200,http://172.17.*.*:4200,http://172.18.*.*:4200,http://172.19.*.*:4200,http://172.2*.*.*:4200,http://172.30.*.*:4200,http://172.31.*.*:4200,http://26.35.140.38:4200}

