<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">OVAY NY BASE DE CLONEO LE APPLI</title>
  <desc id="desc">Bannière animée du SIRH, avec des cartes RH qui rebondissent dans un tableau de bord.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#092e27"/>
      <stop offset=".52" stop-color="#14644d"/>
      <stop offset="1" stop-color="#142d27"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop stop-color="#a8f5d1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a8f5d1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a8f5d1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#001b15" flood-opacity=".45"/>
    </filter>
  </defs>
  <style>
    .float { animation: float 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float2 { animation: float 3.7s ease-in-out -1.4s infinite; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scan 4.8s linear infinite; }
    .spark { animation: blink 1.1s steps(2,end) infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-11px) rotate(1deg); } }
    @keyframes pulse { 0%,100% { opacity: .7; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes scan { from { transform: translateX(-420px); } to { transform: translateX(1260px); } }
    @keyframes blink { 50% { opacity: .18; } }
  </style>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="38" r="140" fill="#61bd91" opacity=".13"/>
  <circle cx="90" cy="330" r="180" fill="#b4f2d1" opacity=".08"/>
  <path d="M0 270 C200 205 310 310 520 246 S900 180 1200 250 V330 H0Z" fill="#0b2923" opacity=".65"/>

  <g class="float" filter="url(#shadow)" transform="translate(77 73)">
    <rect width="190" height="176" rx="22" fill="#f7fff9"/>
    <rect x="20" y="20" width="45" height="45" rx="14" fill="#d7f4e3"/>
    <text x="42" y="50" text-anchor="middle" font-size="24">👔</text>
    <rect x="77" y="24" width="84" height="9" rx="5" fill="#1d5541"/>
    <rect x="77" y="43" width="62" height="7" rx="4" fill="#a2cdb2"/>
    <rect x="20" y="88" width="150" height="12" rx="6" fill="#e6f1e9"/>
    <rect x="20" y="111" width="120" height="12" rx="6" fill="#e6f1e9"/>
    <rect x="20" y="143" width="82" height="17" rx="8" fill="#ff9e65"/>
  </g>

  <g class="float2" filter="url(#shadow)" transform="translate(925 77)">
    <rect width="195" height="167" rx="22" fill="#f7fff9"/>
    <text x="24" y="45" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#285746">CETTE SEMAINE</text>
    <g fill="#d9eee1">
      <rect x="23" y="65" width="31" height="28" rx="7"/><rect x="62" y="65" width="31" height="28" rx="7"/>
      <rect x="101" y="65" width="31" height="28" rx="7"/><rect x="140" y="65" width="31" height="28" rx="7"/>
      <rect x="23" y="101" width="31" height="28" rx="7"/><rect x="62" y="101" width="31" height="28" rx="7"/>
      <rect x="101" y="101" width="31" height="28" rx="7"/><rect x="140" y="101" width="31" height="28" rx="7"/>
    </g>
    <rect class="pulse" x="62" y="65" width="31" height="28" rx="7" fill="#48ad79"/>
    <rect class="pulse" x="140" y="101" width="31" height="28" rx="7" fill="#ffab74"/>
    <text x="23" y="151" font-family="Arial,sans-serif" font-size="12" fill="#56806a">planning: pas de panique</text>
  </g>

  <g class="pulse">
    <rect x="330" y="55" width="540" height="42" rx="21" fill="#b9f2d2" opacity=".13"/>
    <text x="600" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="5" fill="#c8f5d9">SIRH • MODE CLONAGE</text>
  </g>
  <text x="600" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="45" letter-spacing="1.5" fill="#ffffff">OVAY NY BASE</text>
  <text x="600" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="35" letter-spacing="1" fill="#b9f2d2">DE CLONEO LE APPLI</text>
  <text x="600" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#e2f6e9">RECRUTEMENT  ✦  DOSSIER  ✦  PLANNING  ✦  PAIE</text>
  <rect class="scan" x="0" y="0" width="150" height="330" fill="url(#shine)" opacity=".12"/>
  <g class="spark" fill="#f8d279"><path d="m300 91 5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path d="m860 230 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
</svg>
