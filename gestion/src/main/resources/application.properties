spring.application.name=gestion
app.url=${APP_URL:http://localhost:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionrh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3958}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Statut applique automatiquement a toute nouvelle demande de recrutement
app.demande.statut-initial=EN_ATTENTE_VALIDATION_RH

# Demande validee par la direction (id du statut "Approuvee") pouvant generer une offre
app.offre.id-statut-demande-validee=2

# Statut applique automatiquement a toute nouvelle candidature
app.candidature.statut-initial=RECUE

# Dossier de stockage des CV televerses
app.candidature.dossier-cv=uploads/cv

# Valeurs par defaut utilisees pour generer automatiquement un contrat de travail
app.contrat.employeur-nom=
app.contrat.employeur-adresse=
app.contrat.lieu-signature=Antananarivo
app.contrat.duree-travail=
app.contrat.categorie-professionnelle=
app.contrat.indice-classification=

# Dossier de stockage des documents (justificatifs d accreditations, onboarding)
app.document.dossier=uploads/documents

# Notifications email (desactivees par defaut : les messages sont journalises)
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@gestionrh.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Alertes automatiques : nombre de jours avant echeance
app.alerte.contrat-jours=${APP_ALERTE_CONTRAT_JOURS:30}
app.alerte.essai-jours=${APP_ALERTE_ESSAI_JOURS:15}
app.alerte.document-jours=${APP_ALERTE_DOCUMENT_JOURS:30}
app.planning.couverture-minimale=0.5
app.conges.seuil-absents-equipe=0.30
