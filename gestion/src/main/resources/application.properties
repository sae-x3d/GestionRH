spring.application.name=gestion

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionrh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Statut applique automatiquement a toute nouvelle demande de recrutement
app.demande.statut-initial=EN_ATTENTE_VALIDATION_RH

# Demande validee par la direction (id du statut "Approuvee") pouvant generer une offre
app.offre.id-statut-demande-validee=2

# Statut applique automatiquement a toute nouvelle candidature
app.candidature.statut-initial=RECUE

# Validation RH finale apres acceptation de la proposition par le candidat
# true  -> passage par validation RH (employé créé uniquement après validation RH)
# false -> acceptation directe (comportement actuel)
app.candidature.validation-rh-finale=false

# Dossier de stockage des CV televerses
app.candidataire.dossier-cv=uploads/cv
