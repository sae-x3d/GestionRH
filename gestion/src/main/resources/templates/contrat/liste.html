<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}"><section layout:fragment="content" class="page-content"><h1>Mes contrats</h1><div th:if="${#lists.isEmpty(contrats)}">Aucun contrat disponible.</div><div th:each="c : ${contrats}" class="card"><h2 th:text="${c.fonction}"></h2><p th:text="${c.typeContrat + ' · ' + c.statut}"></p><a th:href="@{/contrats/{id}(id=${c.idContrat})}">Consulter</a></div></section></html>
