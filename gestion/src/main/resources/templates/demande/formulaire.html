<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">

<head>
    <title>Nouvelle demande de recrutement</title>
    <link rel="stylesheet" th:href="@{/css/demande.css}">
</head>

<body>
    <div layout:fragment="content">

        <div class="page-header">
            <h2>Nouvelle demande de recrutement</h2>
            <a th:href="@{/demandes}" class="btn btn-outline">Annuler</a>
        </div>

        <div class="alert-success" th:if="${succes}" th:text="${succes}">
            Demande enregistrée
        </div>

        <div class="alert-error" th:if="${erreur}" th:text="${erreur}">
            Message d'erreur
        </div>

        <div class="card card-info">
            <p>
                <strong>Demandeur :</strong>
                <span th:text="${demandeur != null ? demandeur.username : ''}">utilisateur</span>
                <em>(identifié automatiquement)</em>
            </p>
            <p>
                <strong>Statut initial :</strong>
                <span th:text="${statutInitial != null ? statutInitial.libelleStatus : ''}">En attente</span>
                <em>(défini automatiquement)</em>
            </p>
        </div>

        <form class="card card-form" th:action="@{/demandes}" th:object="${demandeForm}" method="post" novalidate>
            <div class="form-group">
                <label for="posteId">Poste demandé <span class="required">*</span></label>
                <select id="posteId" class="form-select" th:field="*{posteId}" th:errorclass="is-invalid">
                    <option value="">-- Sélectionnez un poste --</option>
                    <option th:each="poste : ${postes}" th:value="${poste.idPoste}"
                            th:text="${poste.nomPoste }">
                        Poste
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('posteId')}" th:errors="*{posteId}"></span>
            </div>

            <div class="form-group">
                <label for="departementId">Département <span class="required">*</span></label>
                <select id="departementId" class="form-select" th:field="*{departementId}" th:errorclass="is-invalid">
                    <option value="">-- Sélectionnez un département --</option>
                    <option th:each="departement : ${departements}" th:value="${departement.idDept}"
                            th:text="${departement.nomDept}">
                        Département
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('departementId')}" th:errors="*{departementId}"></span>
            </div>

            <div class="form-group">
                <label for="motifId">Motif <span class="required">*</span></label>
                <select id="motifId" class="form-select" th:field="*{motifId}" th:errorclass="is-invalid">
                    <option value="">-- Sélectionnez un motif --</option>
                    <option th:each="motif : ${motifs}" th:value="${motif.idMotif}" th:text="${motif.libelle}">
                        Motif
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('motifId')}" th:errors="*{motifId}"></span>
            </div>

            <div class="form-group">
                <label for="empRemplaceId">Employé remplacé</label>
                <select id="empRemplaceId" class="form-select" th:field="*{empRemplaceId}" th:errorclass="is-invalid">
                    <option value="">-- Aucun (création de poste) --</option>
                    <option th:each="employe : ${employes}" th:value="${employe.idEmp}" th:text="${employe.nomEmp}">
                        Employé
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('empRemplaceId')}" th:errors="*{empRemplaceId}"></span>
            </div>

            <div class="form-group">
                <label for="budget">Budget</label>
                <input type="number" id="budget" class="form-control" th:field="*{budget}" min="0" step="1000" th:errorclass="is-invalid">
                <span class="field-error" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></span>
            </div>

            <div class="form-group">
                <label for="dateSouhaite">Date souhaitée de recrutement</label>
                <input type="datetime-local" id="dateSouhaite" class="form-control" th:field="*{dateSouhaite}" th:errorclass="is-invalid">
                <span class="field-error" th:if="${#fields.hasErrors('dateSouhaite')}" th:errors="*{dateSouhaite}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Envoyer la demande</button>
                <a class="btn btn-outline" th:href="@{/demandes}">Annuler</a>
            </div>
        </form>

    </div>
</body>

</html>
