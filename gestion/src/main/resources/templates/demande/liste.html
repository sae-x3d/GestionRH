<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Liste des demandes</title>
    <link rel="stylesheet" th:href="@{/css/demande.css}">
</head>

<body>
    <div layout:fragment="content">

        <div class="page-header">
            <h2>Liste des demandes</h2>
            <a sec:authorize="hasAnyAuthority('ROLE_MANAGER', 'ROLE_ADMINISTRATEUR')"
               th:href="@{/demandes/nouvelle}" class="btn btn-primary">Nouvelle demande</a>
        </div>

        <div class="alert-success" th:if="${succes}" th:text="${succes}">
            Demande enregistrée
        </div>

        <div class="alert-error" th:if="${erreur}" th:text="${erreur}">
            Message d'erreur
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Date</th>
                            <th>Poste</th>
                            <th>Département</th>
                            <th>Demandeur</th>
                            <th>Motif</th>
                            <th>Budget</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="demande : ${demandes}">
                            <td th:text="${demande.idDemande}">1</td>
                            <td th:text="${#temporals.format(demande.dateCreation, 'dd/MM/yyyy HH:mm')}">01/01/2026 09:00</td>
                            <td th:text="${demande.poste != null ? demande.poste.nomPoste : '—'}">Poste</td>
                            <td th:text="${demande.departement != null ? demande.departement.nomDept : '—'}">Département</td>
                            <td th:text="${demande.demandeur != null ? demande.demandeur.username : '—'}">utilisateur</td>
                            <td th:text="${demande.motif != null ? demande.motif.libelle : '—'}">Motif</td>
                            <td th:text="${demande.budget ?: '—'}">0</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${@demandeStatusService.classeStatut(demande.demandeStatus != null ? demande.demandeStatus.libelleStatus : null)}"
                                      th:text="${demande.demandeStatus != null ? demande.demandeStatus.libelleStatus : '—'}">Statut</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="empty-state" th:if="${#lists.isEmpty(demandes)}">Aucune demande.</p>
        </div>

    </div>
</body>

</html>
