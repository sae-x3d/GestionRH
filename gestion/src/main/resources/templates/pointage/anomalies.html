<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Anomalies de pointage</title>
</head>

<body>
<section layout:fragment="content">

    <div class="page-header">
        <div>
            <span class="eyebrow">Temps de travail</span>
            <h2>Anomalies de pointage</h2>
            <p>Retards, departs anticipes, heures manquantes et pointages incomplets.</p>
        </div>
        <div style="display:flex;gap:.5rem;">
            <a class="btn btn-outline btn-small" th:href="@{/planning}">Planning</a>
            <a class="btn btn-outline btn-small" th:href="@{/pointage/equipe}">Pointage equipe</a>
        </div>
    </div>

    <div class="alert-success" th:if="${succes}" th:text="${succes}">OK</div>
    <div class="alert-error" th:if="${erreur}" th:text="${erreur}">Erreur</div>

    <form method="post" th:action="@{/pointage/anomalies/detecter}" class="form-row"
          sec:authorize="hasAnyAuthority('ROLE_RH','ROLE_ADMINISTRATEUR')">
        <div class="form-group">
            <label for="dateDetection">Detecter les absences du</label>
            <input type="date" id="dateDetection" name="date" class="form-control"
                   th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Generer les absences</button>
        </div>
    </form>

    <form method="get" th:action="@{/pointage/anomalies}" class="form-row">
        <div class="form-group">
            <label for="statut">Statut</label>
            <select id="statut" name="statut" class="form-select">
                <option value="">Tous</option>
                <option th:each="s : ${statuts}" th:value="${s.name()}" th:text="${s.libelle}"
                        th:selected="${statutSelectionne == s}">Statut</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-outline">Filtrer</button>
        </div>
    </form>

    <div class="alert-info" th:if="${#lists.isEmpty(anomalies)}">Aucune anomalie.</div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(anomalies)}">
        <table class="data-table">
            <thead>
            <tr><th>Salarie</th><th>Date</th><th>Type</th><th>Minutes</th><th>Statut</th><th>Traitement</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${anomalies}">
                <td th:text="${a.employe.nomEmp}">-</td>
                <td th:text="${#temporals.format(a.dateAnomalie, 'dd/MM/yyyy')}">-</td>
                <td th:text="${a.typeAnomalie.libelle}">-</td>
                <td th:text="${a.minutes != null ? a.minutes : '-'}">-</td>
                <td th:text="${a.statut.libelle}">-</td>
                <td>
                    <form th:action="@{/pointage/anomalies/{id}(id=${a.idAnomalie})}" method="post"
                          style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;">
                        <input type="text" name="commentaire" class="form-control" placeholder="Commentaire">
                        <select name="statut" class="form-select" style="max-width:130px;">
                            <option th:each="s : ${statuts}" th:value="${s.name()}" th:text="${s.libelle}"
                                    th:selected="${a.statut == s}">Statut</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-small">Enregistrer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</section>
</body>

</html>
