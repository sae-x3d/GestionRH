<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Pointage de l'equipe</title>
</head>

<body>
<section layout:fragment="content">

    <div class="page-header">
        <div>
            <span class="eyebrow">Temps de travail</span>
            <h2>Pointage de l'equipe</h2>
            <p th:text="${'Semaine du ' + #temporals.format(lundi, 'dd/MM/yyyy')}">Semaine</p>
        </div>
        <div style="display:flex;gap:.5rem;">
            <a class="btn btn-outline btn-small" th:href="@{/planning}">Planning</a>
            <a class="btn btn-outline btn-small" th:href="@{/pointage/anomalies}">Anomalies</a>
        </div>
    </div>

    <div class="alert-info" th:if="${#lists.isEmpty(pointages)}">Aucun pointage sur cette semaine.</div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(pointages)}">
        <table class="data-table">
            <thead>
            <tr><th>Salarie</th><th>Date</th><th>Arrivee</th><th>Depart</th><th>Pause</th><th>Statut</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pointages}">
                <td th:text="${p.employe.nomEmp}">-</td>
                <td th:text="${#temporals.format(p.datePointage, 'dd/MM/yyyy')}">-</td>
                <td th:text="${p.heureArrivee != null ? #temporals.format(p.heureArrivee, 'HH:mm') : '-'}">-</td>
                <td th:text="${p.heureDepart != null ? #temporals.format(p.heureDepart, 'HH:mm') : '-'}">-</td>
                <td th:text="${p.pauseMinutes != null ? p.pauseMinutes + ' min' : '-'}">-</td>
                <td th:text="${p.statut.libelle}">-</td>
            </tr>
            </tbody>
        </table>
    </div>

</section>
</body>

</html>
