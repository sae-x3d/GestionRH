<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}"><head><title>Validation Direction</title></head><body><section layout:fragment="content" class="page-content"><div class="page-header"><div><span class="eyebrow">Congés</span><h2>Validation Direction</h2></div></div>
<div class="alert-success" th:if="${succes}" th:text="${succes}"></div><div class="alert-error" th:if="${erreur}" th:text="${erreur}"></div>
<section class="card"><div class="alert-info" th:if="${#lists.isEmpty(demandes)}">Aucune demande exceptionnelle en attente.</div><div class="table-wrapper" th:unless="${#lists.isEmpty(demandes)}"><table class="data-table"><thead><tr><th>Salarié</th><th>Type</th><th>Période</th><th>Durée</th><th>Motif</th><th>Décision</th></tr></thead><tbody><tr th:each="d : ${demandes}"><td th:text="${d.employe.nomEmp}"></td><td th:text="${d.typeConge.libelle}"></td><td th:text="${d.dateDebut + ' – ' + d.dateFin}"></td><td th:text="${d.nombreJours}"></td><td th:text="${d.motif}"></td><td><form th:action="@{/conges/validation/direction/{id}(id=${d.idDemandeConge})}" method="post"><input name="commentaire" placeholder="Commentaire"><button class="btn btn-primary btn-small" name="accepter" value="true">Accepter</button><button class="btn btn-outline btn-small" name="accepter" value="false">Refuser</button></form></td></tr></tbody></table></div></section></section></body></html>
