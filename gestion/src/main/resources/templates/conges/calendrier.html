<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Calendrier des conges</title>
</head>

<body>
<section layout:fragment="content">

    <div class="page-header">
        <div>
            <span class="eyebrow">Conges</span>
            <h2>Calendrier des conges</h2>
            <p th:text="${#temporals.format(debut, 'MMMM yyyy')}">-</p>
        </div>
        <div style="display:flex;gap:.5rem;">
            <a class="btn btn-outline btn-small"
               th:href="@{/conges/calendrier(mois=${#temporals.format(moisPrecedent, 'yyyy-MM')})}">Precedent</a>
            <a class="btn btn-outline btn-small"
               th:href="@{/conges/calendrier(mois=${#temporals.format(moisSuivant, 'yyyy-MM')})}">Suivant</a>
            <a class="btn btn-outline btn-small" th:href="@{/conges}">Mes conges</a>
        </div>
    </div>

    <div class="alert-info" th:if="${#lists.isEmpty(demandes)}">Aucun conge valide sur cette periode.</div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(demandes)}">
        <table class="data-table">
            <thead>
            <tr><th>Salarie</th><th>Departement</th><th>Type</th><th>Du</th><th>Au</th><th>Jours</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${demandes}">
                <td th:text="${d.employe.nomEmp}">-</td>
                <td th:text="${d.employe.departement != null ? d.employe.departement.nomDept : '-'}">-</td>
                <td th:text="${d.typeConge.libelle}">-</td>
                <td th:text="${#temporals.format(d.dateDebut, 'dd/MM/yyyy')}">-</td>
                <td th:text="${#temporals.format(d.dateFin, 'dd/MM/yyyy')}">-</td>
                <td th:text="${d.nombreJours}">-</td>
            </tr>
            </tbody>
        </table>
    </div>

</section>
</body>

</html>
