<div class="sidebar" id="sidebar" th:fragment="sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="logo">
        <a th:href="@{/}" class="logo-link">
            <span class="logo-mark" aria-hidden="true">GR</span>
            <span class="logo-text">
                <strong>GestionRH</strong>
                <small>Plateforme RH</small>
            </span>
        </a>
    </div>

    <nav class="sidebar-nav" aria-label="Navigation principale">
        <div class="nav-section" th:each="section : ${menu}"
             th:if="${menu != null and !#lists.isEmpty(section.liens)}">
            <p class="nav-section-title" th:text="${section.titre}">Section</p>
            <a th:each="lien : ${section.liens}"
               th:href="@{${lien.url}}"
               th:classappend="${lien.actif} ? 'active'">
                <span th:replace="~{fragments/icons :: icone(${lien.url})}"></span>
                <span th:text="${lien.libelle}">Lien</span>
            </a>
        </div>
    </nav>

    <div class="info-user" th:if="${#authentication != null and #authentication.name != 'anonymousUser'}">
        <a th:href="@{/notifications}" class="sidebar-notifications" title="Notifications"
           aria-label="Notifications"
           th:classappend="${notificationsActif} ? 'active'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge"
                  th:if="${nombreNotifications != null and nombreNotifications > 0}"
                  th:text="${nombreNotifications}">0</span>
        </a>
        <div class="user-info" th:if="${demandeur != null}">
            <span class="avatar avatar-sm" th:text="${#strings.toUpperCase(#strings.substring(demandeur.username, 0, 1))}">U</span>
            <div class="user-meta">
                <span class="user-name" th:text="${demandeur.username}">utilisateur</span>
                <span class="badge" th:if="${demandeur.role != null}"
                      th:text="${demandeur.role.nomRole}">role</span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <path d="m16 17 5-5-5-5"></path>
                    <path d="M21 12H9"></path>
                </svg>
                Se deconnecter
            </button>
        </form>
    </div>
</div>
