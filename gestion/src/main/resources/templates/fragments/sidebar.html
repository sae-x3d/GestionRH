<div class="sidebar" th:fragment="sidebar"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="logo">
        <h2>GESTIONRH</h2>
    </div>

    <nav>
        <a th:href="@{/demandes}">Demandes</a>
        <a sec:authorize="hasAuthority('ROLE_RH')"
           th:href="@{/demandes/validation-rh}">Validation RH</a>
        <a sec:authorize="hasAnyAuthority('ROLE_MANAGER', 'ROLE_ADMINISTRATEUR')"
           th:href="@{/demandes/nouvelle}">Nouvelle demande</a>
    </nav>

    <div class="info-user" th:if="${#authentication != null and #authentication.name != 'anonymousUser'}">
        <div class="user-info">
            <span th:text="${#authentication.name}">utilisateur</span>
            <span class="badge" th:if="${#authentication.principal.utilisateur.role != null}"
                  th:text="${#authentication.principal.utilisateur.role.nomRole}">rôle</span>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit">Se déconnecter</button>
        </form>
    </div>
</div>
