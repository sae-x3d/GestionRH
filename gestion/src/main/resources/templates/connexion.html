<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - GestionRH</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/connexion.css}">
</head>

<body class="login-page">
<main class="login-card">
    <h1 class="login-title">GestionRH</h1>
    <p class="login-subtitle">Connexion a l'application</p>

    <div class="alert-error" th:if="${param.error}">Identifiants invalides.</div>
    <div class="alert-info" th:if="${param.deconnexion}">Vous avez ete deconnecte.</div>

    <form th:action="@{/connexion}" method="post" novalidate>
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" class="form-control" autocomplete="username"
                   th:value="${param.username != null ? param.username[0] : ''}" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <p class="login-back">
        <a th:href="@{/}">Retour a l'accueil</a>
        ·
        <a th:href="@{/offres}">Voir les offres d'emploi</a>
    </p>
</main>
</body>

</html>
