<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}"><head><title>Paramètres du temps de travail</title></head><body><section layout:fragment="content"><div class="page-header"><div><span class="eyebrow">Temps de travail</span><h2>Paramètres</h2></div></div><div class="alert-success" th:if="${succes}" th:text="${succes}"></div><div class="alert-error" th:if="${erreur}" th:text="${erreur}"></div>
<section class="card"><form th:action="@{/temps-travail/parametres}" method="post" class="form-row">
<div class="form-group"><label>Heures hebdomadaires</label><input class="form-control" type="number" name="heuresHebdomadaires" min="1" step="0.5" th:value="${p.heuresHebdomadaires}" required></div>
<div class="form-group"><label>Début habituel</label><input class="form-control" type="time" name="heureDebut" th:value="${p.heureDebut}" required></div><div class="form-group"><label>Fin habituelle</label><input class="form-control" type="time" name="heureFin" th:value="${p.heureFin}" required></div>
<div class="form-group"><label>Pause (minutes)</label><input class="form-control" type="number" name="pauseMinutes" th:value="${p.pauseMinutes}" required></div><div class="form-group"><label>Tolérance retard (minutes)</label><input class="form-control" type="number" name="toleranceRetardMinutes" th:value="${p.toleranceRetardMinutes}" required></div>
<div class="form-group"><label>Palier 25% (minutes)</label><input class="form-control" type="number" name="seuilTranche25Minutes" th:value="${p.seuilTranche25Minutes ?: 480}" required></div>
<div class="form-group"><label>Majoration nuit (%)</label><input class="form-control" type="number" name="majorationNuit" th:value="${p.majorationNuit ?: 25}" required></div><div class="form-group"><label>Majoration dimanche (%)</label><input class="form-control" type="number" name="majorationDimanche" th:value="${p.majorationDimanche ?: 50}" required></div><div class="form-group"><label>Majoration férié (%)</label><input class="form-control" type="number" name="majorationFerie" th:value="${p.majorationFerie ?: 100}" required></div>
<div class="form-actions"><button class="btn btn-primary">Enregistrer</button></div></form></section></section></body></html>
